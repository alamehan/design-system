name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Build & validate tokens/specs
        run: node src/scripts/build.js

      - name: Regenerate split catalog
        run: node src/scripts/split-catalog.js

      - name: Version stamps are single-sourced
        run: node src/scripts/stamp-reference.js --check

      - name: Lint reference (15 integrity gates)
        run: node src/scripts/lint-reference.js

      - name: Lint typography (rendered size = spec size)
        run: node src/scripts/lint-typography.js

      # CI ran eight of ship.js's thirteen steps until v3.5.2, so three gates existed and were
      # only ever enforced on the maintainer's machine. A gate that CI does not run is a gate a
      # pull request can walk past — the same shape as a gate that exists only in a changelog.
      - name: Install Chromium for the visual audit
        run: pip install playwright && playwright install --with-deps chromium

      - name: Visual audit (headless Chromium, 2 viewports)
        run: python3 src/scripts/visual-audit.py

      - name: Lint docs (documented numbers = repo numbers)
        run: node src/scripts/lint-docs.js

      - name: Validate page specs
        run: python3 src/scripts/validate-pages.py

      - name: Clone-traffic merge self-test (offline)
        run: node src/scripts/clone-traffic.js --self-test

      - name: Panel bundle is in sync with its sources
        run: node tools/build-wizard.js --check

      - name: Contract check (no breaking change without MAJOR + alias)
        run: node src/scripts/contract-check.js

      - name: Fail if generated files are out of date
        run: |
          git add -A
          git diff --cached --stat --exit-code || {
            echo '::error::Generated files are stale. Run: node tools/ship.js'; exit 1; }

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Allow file:// submodules in the sandbox
        run: git config --global protocol.file.allow always
      - name: Panel lifecycle end-to-end
        run: node tests/e2e.js
